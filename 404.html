<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Manali Strays</title>
  <meta name="description" content="The page you were looking for could not be found or encountered an issue." />

  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f9f8f3;
      --ink: #1f1f1a;
      --muted: #65645c;
      --yellow: #ffd800;
      --yellow-hover: #f5cf00;
    }

    body {
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 1100px;
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--ink);
    }

    .brand-logo img {
      height: 32px;
      width: auto;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }

    .header-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: color 150ms ease;
    }

    .header-link:hover {
      color: var(--ink);
    }

    /* Main Container */
    .error-page-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1.5rem 2.5rem;
      text-align: center;
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .error-badge {
      display: inline-block;
      padding: 0.28rem 0.75rem;
      background: #ecebe2;
      color: var(--ink);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    /* ==============================================================
       Ultra-Fast Animated Minimalist Face Component
       Zero external fonts, pure hardware-accelerated SVG transforms
       ============================================================== */
    .my-custom-face-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 280px;
      background: transparent;
      color: var(--ink);
      overflow: visible;
    }

    .my-custom-face-container .face {
      width: 180px;
      height: auto;
    }

    .my-custom-face-container .face__eyes,
    .my-custom-face-container .face__eye-lid,
    .my-custom-face-container .face__mouth-left,
    .my-custom-face-container .face__mouth-right,
    .my-custom-face-container .face__nose,
    .my-custom-face-container .face__pupil {
      animation: eyes 1s 0.3s forwards;
    }

    .my-custom-face-container .face__eye-lid,
    .my-custom-face-container .face__pupil {
      animation-duration: 4s;
      animation-delay: 1.3s;
      animation-iteration-count: infinite;
    }

    .my-custom-face-container .face__eye-lid {
      animation-name: eye-lid;
    }
    .my-custom-face-container .face__mouth-left {
      animation-name: mouth-left;
    }
    .my-custom-face-container .face__mouth-right {
      animation-name: mouth-right;
    }
    .my-custom-face-container .face__nose {
      animation-name: nose;
    }
    .my-custom-face-container .face__pupil {
      animation-name: pupil;
    }

    @keyframes eye-lid {
      0%,
      40%,
      45%,
      100% {
        transform: translateY(0);
      }
      42.5% {
        transform: translateY(17.5px);
      }
    }

    @keyframes eyes {
      from {
        transform: translateY(112.5px);
      }
      to {
        transform: translateY(15px);
      }
    }

    @keyframes pupil {
      0%,
      37.5%,
      40%,
      45%,
      87.5%,
      100% {
        stroke-dashoffset: 0;
        transform: translate(0, 0);
      }
      12.5%,
      25%,
      62.5%,
      75% {
        transform: translate(-35px, 0);
      }
      42.5% {
        stroke-dashoffset: 35;
        transform: translate(0, 17.5px);
      }
    }

    @keyframes mouth-left {
      from,
      50% {
        stroke-dashoffset: -102;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes mouth-right {
      from,
      50% {
        stroke-dashoffset: 102;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes nose {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(0, 22.5px);
      }
    }

    /* Message & Actions */
    .error-title {
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 800;
      color: var(--ink);
      line-height: 1.25;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .error-desc {
      font-size: clamp(0.92rem, 2vw, 1.05rem);
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 1.8rem;
      max-width: 440px;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.8rem 1.6rem;
      border-radius: 12px;
      background: var(--yellow);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 160ms ease;
      box-shadow: 0 4px 14px rgba(255, 216, 0, 0.35);
    }

    .btn-home:hover {
      background: var(--yellow-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 216, 0, 0.45);
    }

    .btn-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.4rem;
      border-radius: 12px;
      border: 1.5px solid #dfded6;
      background: #ffffff;
      color: var(--ink);
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      transition: all 150ms ease;
    }

    .btn-contact:hover {
      border-color: var(--ink);
      transform: translateY(-1px);
    }

    /* Footer */
    footer {
      width: 100%;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      border-top: 1px solid #ebeae0;
    }

    footer a {
      color: var(--ink);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand-logo" href="index.html">
      <img src="Group 1.png" alt="Manali Strays Logo" onerror="this.style.display='none'" />
      <span>Manali Strays</span>
    </a>
    <div class="header-links">
      <a class="header-link" href="index.html">Home</a>
      <a class="header-link" href="user-dashboard.html">Account</a>
      <a class="header-link" href="contact.html">Contact</a>
    </div>
  </header>

  <main class="error-page-content">
    <span class="error-badge">Error 404</span>

    <!-- Ultra-fast Animated Face -->
    <div class="my-custom-face-container">
      <svg class="face" viewBox="0 0 320 380">
        <g
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="25"
        >
          <g class="face__eyes" transform="translate(0,112.5)">
            <g transform="translate(15,0)">
              <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
              <polyline
                class="face__pupil"
                points="55,120 55,155"
                stroke-dasharray="35 35"
              ></polyline>
            </g>
            <g transform="translate(230,0)">
              <polyline class="face__eye-lid" points="37,0 0,120 75,120"></polyline>
              <polyline
                class="face__pupil"
                points="55,120 55,155"
                stroke-dasharray="35 35"
              ></polyline>
            </g>
          </g>
          <rect
            class="face__nose"
            x="132.5"
            y="112.5"
            width="55"
            height="155"
            rx="4"
            ry="4"
          ></rect>
          <g transform="translate(65,334)" stroke-dasharray="102 102">
            <path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0"></path>
            <path class="face__mouth-right" d="M 95 0 C 150 0 190 30 190 30"></path>
          </g>
        </g>
      </svg>
    </div>

    <h1 class="error-title">Looking everywhere, but couldn't find it</h1>
    <p class="error-desc">The page you were looking for doesn't exist, was moved, or an unexpected issue happened.</p>

    <div class="error-actions">
      <a class="btn-home" href="index.html">← Back to Home</a>
      <a class="btn-contact" href="contact.html">Report Issue / Contact</a>
    </div>
  </main>

  <footer>
    <p>© 2026 Manali Strays | Silly Sensei · <a href="contact.html">Contact Us</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
  </footer>
</body>
</html>
