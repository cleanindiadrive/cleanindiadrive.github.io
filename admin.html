<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manali Strays — Autopay Admin Panel</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --yellow: #ffda00;
        --yellow-hover: #eab308;
        --emerald: #10b981;
        --rose: #f43f5e;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Poppins", sans-serif;
        padding: 1.5rem;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--yellow);
      }

      .status-badge {
        font-size: 0.75rem;
        color: var(--emerald);
        background: rgba(16, 185, 129, 0.1);
        padding: 0.25rem 0.65rem;
        border-radius: 999px;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      /* Quick Custom Plan Box */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
      }

      .card h2 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }

      .quick-form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      input[type="text"],
      input[type="number"] {
        flex: 1;
        min-width: 180px;
        padding: 0.6rem 0.85rem;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: #fff;
        font-size: 0.85rem;
      }

      input:focus {
        outline: none;
        border-color: var(--yellow);
      }

      button {
        padding: 0.6rem 1.25rem;
        background: var(--yellow);
        color: #000;
        font-weight: 700;
        font-size: 0.85rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 160ms ease;
      }

      button:hover {
        background: var(--yellow-hover);
      }

      button.btn-danger {
        background: rgba(244, 63, 94, 0.15);
        color: var(--rose);
        border: 1px solid rgba(244, 63, 94, 0.3);
      }

      button.btn-danger:hover {
        background: var(--rose);
        color: #fff;
      }

      /* Search & Table */
      .search-bar {
        margin-bottom: 1rem;
        width: 100%;
      }

      .search-bar input {
        width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th, td {
        padding: 0.75rem 0.85rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      .user-name {
        font-weight: 600;
        color: #fff;
      }

      .user-email {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .custom-tag {
        display: inline-block;
        font-weight: 700;
        color: var(--yellow);
        background: rgba(255, 218, 0, 0.12);
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
      }

      .row-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .amount-mini {
        width: 90px !important;
        min-width: 80px !important;
        padding: 0.4rem 0.5rem !important;
      }

      #toast {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: #064e3b;
        color: #ecfdf5;
        border: 1px solid var(--emerald);
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        opacity: 0;
        transform: translateY(10px);
        transition: all 200ms ease;
        pointer-events: none;
      }

      #toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Manali Strays — Autopay Admin</h1>
        <div class="status-badge">● Database Connected</div>
      </header>

      <!-- Set Custom Amount Quick Form -->
      <section class="card">
        <h2>Set Custom Autopay Amount for an Account</h2>
        <div class="quick-form">
          <input type="text" id="target-id" placeholder="Supporter Email or Firebase UID" />
          <input type="number" id="target-amount" placeholder="Amount in ₹ (e.g. 2500)" min="1" />
          <button type="button" id="btn-save-quick">Save Custom Autopay</button>
        </div>
      </section>

      <!-- Supporter List -->
      <section class="card">
        <h2>Supporters &amp; Custom Autopay Amounts</h2>
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search by name or email…" />
        </div>
        <table>
          <thead>
            <tr>
              <th>Supporter</th>
              <th>Current Custom Plan</th>
              <th>Set New Amount (₹)</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--muted); padding: 2rem;">Loading accounts…</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>

    <div id="toast"></div>

    <script type="module" src="js/admin.js"></script>
  </body>
</html>
