/* ==============================================================
   iOS-Style Segmented Sliding Control for Autopay Tiers
   ============================================================== */
.cc-ios-tabs {
  display: flex;
  justify-content: center;
  align-items: center;
  width: auto;
  padding: 0.2rem 0;
  font-family: 'Outfit', Inter, Arial, sans-serif;
  user-select: none;
}

.cc-ios-tabs__input {
  display: none;
}

.cc-ios-tabs__control {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  width: 320px;
  max-width: 100%;
  padding: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow:
    inset 0 0 0 1px rgba(15, 23, 42, 0.08),
    0 2px 8px rgba(15, 23, 42, 0.06);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.cc-ios-tabs__thumb {
  position: absolute;
  top: 4px;
  left: 4px;
  width: calc(25% - 2px);
  height: calc(100% - 8px);
  border-radius: 999px;
  background: #1f1f1a;
  box-shadow:
    0 1px 2px rgba(15, 23, 42, 0.2),
    0 6px 16px rgba(15, 23, 42, 0.16);
  transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}

.cc-ios-tabs__item {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  border-radius: 999px;
  color: #65645c;
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  transition: color 240ms ease;
}

.cc-ios-tabs__item:hover {
  color: #1f1f1a;
}

/* ==============================================================
   Uiverse.io "New Transaction" POS Terminal Card Animation
   ============================================================== */
.pos-transaction-container {
  background-color: #ffffff;
  display: flex;
  width: 260px;
  max-width: 100%;
  height: 54px;
  position: relative;
  border-radius: 10px;
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  border: 1px solid #ebeae0;
  box-shadow: 0 3px 10px rgba(35, 35, 25, 0.06);
  user-select: none;
  cursor: pointer;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}

/* Subtle, elegant hover — stays at 260px width so text is always readable */
.pos-transaction-container:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(35, 35, 25, 0.1);
  border-color: #d6d4c4;
}

.pos-transaction-container:active {
  transform: scale(0.985);
}

/* Width only shrinks to focus on the terminal animation when actively animating */
.pos-transaction-container.is-animating,
.pos-transaction-container.is-animating-reverse {
  transform: scale(1.02);
  width: 116px;
}

.pos-transaction-container.is-animating .left-side,
.pos-transaction-container.is-animating-reverse .left-side {
  width: 100%;
}

/* Home page subscription button: yellow */
.home-new-tx-wrap .pos-transaction-container .left-side,
.pos-transaction-container[data-state="subscribe"] .left-side {
  background-color: var(--yellow);
}

.pos-transaction-container .left-side {
  background-color: #5de2a3;
  width: 68px;
  height: 54px;
  border-radius: 4px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
  overflow: hidden;
}

.pos-transaction-container .right-side {
  width: calc(100% - 68px);
  display: flex;
  align-items: center;
  overflow: hidden;
  cursor: pointer;
  justify-content: space-between;
  white-space: nowrap;
  transition: background-color 0.25s ease;
}

.pos-transaction-container .right-side:hover {
  background-color: #f9f7f9;
}

.pos-transaction-container .arrow {
  width: 12px;
  height: 12px;
  margin-right: 12px;
  flex-shrink: 0;
  transition: transform 0.25s ease;
}

.pos-transaction-container:hover .arrow {
  transform: translateX(3px);
}

.pos-transaction-container .new {
  font-size: 14.5px;
  font-family: 'Outfit', 'Lexend Deca', sans-serif;
  font-weight: 700;
  color: #1a1a1a;
  margin-left: 14px;
  letter-spacing: -0.01em;
}

/* Debit/Credit Bank Card */
.pos-transaction-container .card {
  width: 38px;
  height: 24px;
  background: linear-gradient(135deg, #15803d 0%, #166534 100%);
  border-radius: 4px;
  position: absolute;
  top: 15px;
  left: calc(50% - 19px);
  display: flex;
  z-index: 10;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.25);
  transition: transform 0.3s ease;
}

.pos-transaction-container:hover:not(.is-animating):not(.is-animating-reverse) .card {
  transform: translateY(-2px);
}

.pos-transaction-container .card-line {
  width: 32px;
  height: 5px;
  background-color: #052e16;
  border-radius: 1px;
  margin-top: 3px;
}

.pos-transaction-container .buttons {
  width: 4px;
  height: 4px;
  background-color: #eab308;
  box-shadow: 0 -5px 0 0 #f59e0b, 0 5px 0 0 #fbbf24;
  border-radius: 50%;
  margin-top: 2px;
  transform: rotate(90deg);
  margin: 4px 0 0 -14px;
}

/* Slower, smoother 2.0s card insertion */
.pos-transaction-container.is-animating .card {
  animation: slide-top 2s cubic-bezier(0.4, 0, 0.2, 1) both;
}

/* Reverse: same keyframes played backwards for pause — starts from final inserted frame */
.pos-transaction-container.is-animating-reverse .card {
  animation: slide-top 2s cubic-bezier(0.4, 0, 0.2, 1) both reverse;
}

.pos-transaction-container.is-animating .post {
  animation: slide-post 2s cubic-bezier(0.4, 0, 0.2, 1) both;
}

/* Reverse: same keyframes played backwards */
.pos-transaction-container.is-animating-reverse .post {
  animation: slide-post 2s cubic-bezier(0.4, 0, 0.2, 1) both reverse;
}

@keyframes slide-top {
  0% {
    transform: translateY(0) rotate(0deg);
  }

  22% {
    transform: translateY(-6px) rotate(45deg);
  }

  40% {
    transform: translateY(-8px) rotate(90deg);
  }

  55% {
    transform: translateY(-8px) rotate(90deg);
  }

  82%,
  100% {
    transform: translateY(16px) rotate(90deg);
  }
}

/* POS Terminal Reader Machine */
.pos-transaction-container .post {
  width: 38px;
  height: 42px;
  background-color: #27272a;
  border: 1px solid #3f3f46;
  position: absolute;
  z-index: 11;
  top: 56px;
  left: calc(50% - 19px);
  border-radius: 5px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

.pos-transaction-container .post-line {
  width: 30px;
  height: 5px;
  background-color: #09090b;
  position: absolute;
  border-radius: 0 0 2px 2px;
  left: calc(50% - 15px);
  top: 3px;
}

.pos-transaction-container .post-line:before {
  content: "";
  position: absolute;
  width: 30px;
  height: 5px;
  background-color: #18181b;
  top: -4px;
}

.pos-transaction-container .screen {
  width: 30px;
  height: 14px;
  background-color: #18181b;
  border: 1px solid #3f3f46;
  position: absolute;
  top: 11px;
  left: calc(50% - 15px);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pos-transaction-container .numbers {
  width: 6px;
  height: 6px;
  background-color: #52525b;
  box-shadow: 0 -9px 0 0 #52525b, 0 9px 0 0 #52525b;
  border-radius: 1px;
  position: absolute;
  transform: rotate(90deg);
  left: 16px;
  top: 29px;
}

.pos-transaction-container .numbers-line2 {
  width: 6px;
  height: 6px;
  background-color: #71717a;
  box-shadow: 0 -9px 0 0 #71717a, 0 9px 0 0 #71717a;
  border-radius: 1px;
  position: absolute;
  transform: rotate(90deg);
  left: 16px;
  top: 36px;
}

@keyframes slide-post {
  0%,
  12% {
    transform: translateY(0);
  }

  45%,
  100% {
    transform: translateY(-40px);
  }
}

.pos-transaction-container .dollar {
  position: absolute;
  font-size: 11px;
  font-family: 'Outfit', 'Lexend Deca', sans-serif;
  font-weight: 700;
  width: 100%;
  left: 0;
  top: 0;
  color: #22c55e;
  text-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
  text-align: center;
  line-height: 14px;
}

.pos-transaction-container.is-animating .dollar {
  animation: fade-in-fwd 0.35s 1.45s backwards;
}

.pos-transaction-container.is-animating-reverse .dollar {
  animation: fade-in-fwd 0.35s 0s both reverse;
}

@keyframes fade-in-fwd {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }

  100% {
    opacity: 1;
    transform: scale(1);
  }
}

.pos-transaction-container.is-disabled,
.pos-transaction-container[aria-disabled="true"] {
  opacity: 0.52;
  cursor: not-allowed;
  pointer-events: none;
  filter: grayscale(0.5);
}

  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.85rem;
  margin-bottom: 1.4rem;
}

.stat-card {
  display: flex;
  align-items: center;
  gap: 0.95rem;
  padding: 1.1rem 1.25rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: 0 6px 20px rgba(35, 35, 25, 0.035);
  transition: transform 140ms ease, box-shadow 140ms ease;
}

.stat-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(35, 35, 25, 0.06);
}

.stat-icon-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  background: transparent;
  border-radius: 0;
}

.stat-icon-wrap.stat-icon-plan,
.stat-icon-wrap.stat-icon-renewal {
  background: transparent;
  border-radius: 0;
  overflow: visible;
}

.stat-icon-img {
  display: block;
  width: 32px;
  height: 32px;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
}

.stat-icon-img.stat-icon-rupee {
  width: 32px;
  height: 32px;
}

.stat-icon-img.stat-icon-payment {
  width: 34px;
  height: 34px;
}

.stat-icon-img.stat-icon-calendar {
  width: 42px;
  height: 42px;
}

.stat-meta {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stat-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.15rem;
}

.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
}

.stat-sub {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.15rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Accordions */
.tracker-accordions {
  display: grid;
  gap: 0.75rem;
}

.tracker-accordion {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: 0 6px 20px rgba(35, 35, 25, 0.035);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

.tracker-accordion:hover {
  border-color: #d8d7cf;
}

.tracker-accordion summary {
  display: flex;
  min-height: 56px;
  align-items: center;
  justify-content: space-between;
  gap: 0.85rem;
  padding: 0.85rem 1.25rem;
  cursor: pointer;
  list-style: none;
  color: var(--ink);
  font-size: 0.92rem;
  font-weight: 600;
  user-select: none;
  -webkit-user-select: none;
  transition: background 160ms ease;
}

.tracker-accordion summary > span:first-child {
  flex: 1 1 auto;
  min-width: 0;
}

.tracker-accordion summary::-webkit-details-marker {
  display: none;
}

.tracker-accordion summary::after {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-right: 2px solid #8e8d85;
  border-bottom: 2px solid #8e8d85;
  transform: rotate(45deg);
  margin-left: 0.5rem;
  flex-shrink: 0;
  transition: transform 200ms ease;
}

.tracker-accordion[open] summary {
  border-bottom: 1px solid #edece4;
  background: #fffdf5;
}

.tracker-accordion[open] summary::after {
  transform: rotate(-135deg);
}

.accordion-value {
  flex: 0 1 auto;
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  background: var(--green-soft);
  color: var(--green);
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1.25;
  text-align: right;
  margin-left: auto;
}

.accordion-content {
  padding: 1.1rem 1.25rem;
}

.accordion-lead {
  color: var(--muted);
  font-size: 0.8rem;
  margin-bottom: 0.85rem;
  line-height: 1.45;
}

.accordion-lead span,
.accordion-lead b {
  color: var(--ink);
  font-weight: 600;
}

.subscription-status-card {
  padding: 1rem 1.15rem;
  border-radius: 12px;
  border: 1px solid #e8e6dc;
  background: #fafaf5;
  margin-bottom: 1rem;
}

.status-banner-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
}

.status-banner-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
}

.subscription-status-card p {
  margin: 0;
  color: #55554f;
  font-size: 0.8rem;
  line-height: 1.45;
}

.nested-accordion {
  margin-top: 0.75rem;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
}

.nested-accordion summary {
  display: flex;
  min-height: 44px;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
  padding: 0.58rem 0.75rem;
  cursor: pointer;
  list-style: none;
  color: var(--ink);
  font-size: 0.76rem;
  font-weight: 600;
  user-select: none;
  -webkit-user-select: none;
}

.nested-accordion summary > span:first-child {
  flex: 1 1 auto;
  min-width: 0;
}

.nested-accordion summary::-webkit-details-marker {
  display: none;
}

.nested-accordion summary::after {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  border-right: 2px solid #8e8d85;
  border-bottom: 2px solid #8e8d85;
  transform: rotate(45deg);
  margin-left: 0.5rem;
  flex-shrink: 0;
  transition: transform 200ms ease;
}

.nested-accordion[open] summary {
  border-bottom: 1px solid var(--line);
  background: #fafaf5;
}

.nested-accordion[open] summary::after {
  transform: rotate(-135deg);
}

.nested-accordion .accordion-value {
  flex: 0 1 auto;
  font-size: 0.74rem;
  padding: 0.18rem 0.55rem;
  border-radius: 999px;
  background: var(--green-soft);
  color: var(--green);
  text-align: right;
  margin-left: auto;
}

.nested-content {
  padding: 0.6rem;
}

.subscription-payment-list {
  width: 100%;
}

.subscription-table-wrap,
.subscription-charges-table-wrap {
  margin-top: 0.75rem;
}

.subscription-summary-row {
  cursor: pointer;
  transition: background 160ms ease;
}

.subscription-summary-row:hover,
.subscription-summary-row[aria-expanded="true"] {
  background: #fffef5;
}

.subscription-summary-row > td:first-child {
  display: flex;
  min-width: 155px;
  align-items: center;
  gap: 0.5rem;
}

.subscription-row-indicator {
  display: grid;
  width: 20px;
  height: 20px;
  flex: 0 0 20px;
  place-items: center;
  border: 1px solid #d8d8d1;
  border-radius: 50%;
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1;
}

.subscription-row-indicator::before {
  content: "+";
}

.subscription-summary-row[aria-expanded="true"] .subscription-row-indicator::before {
  content: "−";
}

.subscription-row-copy,
.subscription-row-copy small,
.subscription-charges-table td small {
  display: block;
}

.subscription-row-copy {
  min-width: 0;
}

.subscription-row-copy strong {
  color: var(--ink);
  font-size: 0.76rem;
}

.subscription-row-copy small {
  max-width: 190px;
  overflow: hidden;
  color: var(--muted);
  font-size: 0.68rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.subscription-charges-row > td {
  padding: 0;
  background: #fff;
}


.subscription-charges-table td:nth-child(2) {
  max-width: 240px;
  overflow-wrap: anywhere;
}

.subscription-reference {
  display: block;
  color: var(--ink);
  font-weight: 600;
}

.subscription-charges-table td small {
  max-width: 240px;
  margin-top: 0.15rem;
  color: var(--muted);
  font-size: 0.66rem;
  line-height: 1.35;
}

.gift-history-list {
  display: grid;
  gap: 0.55rem;
  margin-top: 0.7rem;
}

.gift-history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.6rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fffef5;
}

.gift-history-item strong,
.gift-history-item small {
  display: block;
}

.gift-history-item strong {
  color: var(--ink);
  font-size: 0.78rem;
}

.gift-history-item small {
  margin-top: 0.15rem;
  color: var(--muted);
  font-size: 0.7rem;
}

.dashboard-note {
  margin-top: 0.75rem;
  color: var(--muted);
  font-size: 0.72rem;
}

/* ==========================================================================
   Table & Card Design System (Uiverse.io by Rodrypaladin - Adapted)
   ========================================================================== */

/* Uiverse.io Card Component */
.card,
.uiverse-table-card {
  width: 100%;
  max-width: 380px;
  background: rgb(44, 44, 44);
  font-family: "Poppins", sans-serif;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
  border: 1px solid rgb(203, 203, 203);
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(35, 35, 25, 0.06);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover,
.uiverse-table-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(35, 35, 25, 0.1);
}

.card__title {
  color: #ffffff;
  font-weight: 600;
  padding: 8px 14px;
  border-bottom: 1px solid rgb(167, 159, 159);
  font-size: 0.84rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  letter-spacing: 0.01em;
  background: rgb(44, 44, 44);
}

.card__title-main {
  font-weight: 600;
  color: #ffffff;
}

.card__badge {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 0.15rem 0.55rem;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 999px;
  color: #ffffff;
}

.card__data {
  font-size: 0.76rem;
  display: flex;
  justify-content: space-between;
  border-right: 1px solid rgb(203, 203, 203);
  border-left: 1px solid rgb(203, 203, 203);
  border-bottom: 1px solid rgb(203, 203, 203);
  background: #ffffff;
}

.card__right {
  width: 48%;
  border-right: 1px solid rgb(203, 203, 203);
  color: #555555;
  font-weight: 500;
}

.card__left {
  width: 52%;
  text-align: end;
  font-weight: 600;
  color: #222222;
}

.item {
  padding: 5px 0;
  background-color: #ffffff;
  min-height: 29px;
  display: flex;
  align-items: center;
  font-size: 0.76rem;
}

.card__right .item {
  padding-left: 0.8em;
  padding-right: 0.4em;
  justify-content: flex-start;
}

.card__left .item {
  padding-right: 0.8em;
  padding-left: 0.4em;
  justify-content: flex-end;
  text-align: right;
  flex-wrap: wrap;
}

.record-note {
  display: block;
  width: 100%;
  font-size: 0.65rem;
  color: #777777;
  font-weight: 400;
  line-height: 1.2;
}

.item:nth-child(even) {
  background: rgb(234, 235, 234);
}

/* Card Lists */
.uiverse-card-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
  padding: 0.9rem;
  background: #fafaf7;
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
}

/* Table Wrappers with Rodrypaladin Styling */
.payments-table-wrap,
.subscription-table-wrap,
.subscription-charges-table-wrap {
  background: rgb(44, 44, 44);
  font-family: "Poppins", sans-serif;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  border-bottom-left-radius: 6px;
  border-bottom-right-radius: 6px;
  border: 1px solid rgb(203, 203, 203);
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(35, 35, 25, 0.06);
  margin-top: 0.75rem;
}

.table-scroll-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: #ffffff;
  scrollbar-width: thin;
  scrollbar-color: rgba(44, 44, 44, 0.25) transparent;
}

.table-scroll-wrap::-webkit-scrollbar {
  height: 6px;
}

.table-scroll-wrap::-webkit-scrollbar-track {
  background: #f1f1ee;
}

.table-scroll-wrap::-webkit-scrollbar-thumb {
  background: rgba(44, 44, 44, 0.3);
  border-radius: 3px;
}

/* Header Controls & View Toggle */
.table-view-controls {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.view-toggle {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}

.view-toggle-btn {
  background: transparent;
  border: none;
  color: rgba(255, 255, 255, 0.75);
  font-size: 0.66rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.view-toggle-btn:hover {
  color: #ffffff;
}

.view-toggle-btn.is-active {
  background: #ffffff;
  color: rgb(44, 44, 44);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
}

/* Tables */
.payments-table,
.subscription-table,
.subscription-charges-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.74rem;
  font-family: "Poppins", sans-serif;
  background: #ffffff;
  min-width: 520px;
}

.subscription-table {
  min-width: 580px;
}

.subscription-charges-table {
  min-width: 540px;
}

.payments-table th,
.subscription-table th,
.subscription-charges-table th {
  padding: 8px 12px;
  background: rgb(44, 44, 44);
  color: #ffffff;
  font-weight: 600;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  text-align: left;
  border-bottom: 1px solid rgb(167, 159, 159);
  border-right: 1px solid rgba(203, 203, 203, 0.35);
  white-space: nowrap;
}

.payments-table th:last-child,
.subscription-table th:last-child,
.subscription-charges-table th:last-child {
  border-right: none;
}

.payments-table td,
.subscription-table td,
.subscription-charges-table td {
  padding: 7px 12px;
  border-right: 1px solid rgb(203, 203, 203);
  border-bottom: 1px solid rgb(203, 203, 203);
  vertical-align: middle;
  color: #272727;
  font-size: 0.74rem;
}

.payments-table td:last-child,
.subscription-table td:last-child,
.subscription-charges-table td:last-child {
  border-right: none;
}

.payments-table tr:nth-child(even) td,
.subscription-table tbody tr:nth-child(even) td,
.subscription-charges-table tbody tr:nth-child(even) td {
  background: rgb(234, 235, 234);
}

.payments-table tr:nth-child(odd) td,
.subscription-table tbody tr:nth-child(odd) td,
.subscription-charges-table tbody tr:nth-child(odd) td {
  background: #ffffff;
}

.payments-table tr:hover td,
.subscription-table tbody tr:hover td,
.subscription-charges-table tbody tr:hover td {
  background: #fffbe6 !important;
}

.table-ref-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 0.72rem;
  font-weight: 600;
  color: #272727;
}

/* Nested Subscription Charges Panel */
.subscription-charges-panel {
  padding: 0;
  background: #fbfbf8;
  border-top: 1px solid rgb(203, 203, 203);
}

.subscription-charges-panel .card__title--nested {
  background: #383838;
  border-bottom: 1px solid #555555;
  font-size: 0.76rem;
  padding: 6px 12px;
}

.subscription-charges-table-wrap {
  margin: 0;
  border: none;
  border-radius: 0;
}

.status-pill {
  display: inline-block;
  padding: 0.17rem 0.45rem;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: capitalize;
}

.status-paid,
.status-active {
  background: var(--green-soft);
  color: var(--green);
}

.status-paused,
.status-pending {
  background: var(--yellow-soft);
  color: #806800;
}

.status-cancelled {
  background: #fbe0dd;
  color: #a33a2f;
}

.sphere-ended-badge,
.subscription-ended-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: #a33a2f;
  font-weight: 600;
  font-size: 0.76rem;
  background: #fbe0dd;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
}

.charge-row-cancelled {
  background: #fffcfb;
}

.charge-row-cancelled td {
  color: #8c4238;
}

.charge-row-cancelled .subscription-reference {
  color: #8c8c8c;
}

.subscription-summary-row.is-cancelled {
  background: #fdfaf9;
}

.subscription-summary-row.is-cancelled:hover {
  background: #faefec;
}

.subscription-summary-row.is-cancelled .subscription-row-copy small {
  color: #a33a2f;
  font-weight: 500;
}

.cancel-modal {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 1rem;
}

.cancel-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(25, 25, 20, 0.42);
  backdrop-filter: blur(2px);
}

.cancel-modal-card {
  position: relative;
  width: min(100%, 390px);
  padding: 1.5rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: 0 24px 70px rgba(25, 25, 20, 0.2);
  text-align: center;
}

.cancel-modal-close {
  position: absolute;
  top: 0.65rem;
  right: 0.75rem;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 1.35rem;
  line-height: 1;
}

.cancel-modal-close:hover {
  background: #f4f4ef;
  color: var(--ink);
}

.cancel-modal-icon {
  display: grid;
  width: 48px;
  height: 48px;
  margin: 0 auto 0.9rem;
  place-items: center;
  border-radius: 15px;
  background: #fbe0dd;
  color: #a33a2f;
  font-size: 1.25rem;
  font-weight: 800;
}

.cancel-modal-card h2 {
  margin-bottom: 0.45rem;
  color: var(--ink);
  font-size: 1.2rem;
}

.cancel-modal-card p {
  margin: 0 auto 1.2rem;
  color: var(--muted);
  font-size: 0.78rem;
}

.cancel-modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

.status-failed {
  background: #fbe0dd;
  color: #b3261e;
}

.empty-state {
  padding: 1.25rem !important;
  color: var(--muted);
  text-align: center;
}

    padding-top: 2.5rem;

  .mode-panel {
    align-items: stretch;
    flex-direction: column;

  .mode-panel > div:first-child {
    width: 100%;
  }

  #one-time-mode,
  #gift-mode {

  .mode-form-row {
    align-items: stretch;
    flex-direction: column;
  }

  .mode-form-row .mode-action,
  #gift-mode > .mode-action,
  #monthly-mode > .mode-action {
    width: 100%;
  }

  .mode-panel-actions {
    width: 100%;
    align-items: stretch;
    flex-direction: column;
  }

  .subscription-actions {
    flex-direction: column;
  }

  .subscription-actions .mode-action {
    width: 100%;
  }

  .compact-amount {
    width: 100%;
  }

  .dashboard-user-email {
    display: none;
  }

  .dashboard-profile {
    align-items: flex-start;
  }

  .dashboard-home-link {
    padding: 0.45rem 0.55rem;
  }

  .card__title {
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .table-view-controls {
    width: 100%;
    justify-content: space-between;
  }

  .uiverse-card-list {
    grid-template-columns: 1fr;
    padding: 0.65rem;
    gap: 0.75rem;

  .card,

    max-width: 100%;

  nav {

    padding-left: 0.25rem;
  }

  .account-link {
    width: 38px;
    height: 38px;
    min-height: 38px;
    padding: 0;
    justify-content: center;
  }

  .account-link span {
    display: none;
  }

  .hero-section {
    padding-top: 1.5rem;
    padding-bottom: 1.25rem;
  }

  .hero-section h1 {
    font-size: clamp(2.2rem, 11vw, 2.9rem);

/* Card-based account dashboard rollback */
.dashboard-page {
  background: var(--canvas);
}

.dashboard-header {
  background: rgba(255, 255, 255, 0.94);
}

.dashboard-header .dashboard-nav {

}

.dashboard-nav .logo img {

}

.dashboard-user {

}

.dashboard-support-link {

  text-decoration: none;
}

.dashboard-support-link:hover {

}


.dashboard-main {

.dashboard-welcome {

.dashboard-profile {

}

.account-avatar {

  height: 56px;
  flex-basis: 56px;
  border-radius: 17px;
  background: #405866;

  font-size: 1.35rem;
}

.dashboard-eyebrow {

  font-size: 0.65rem;
  font-weight: 700;

}

.dashboard-welcome h1 {
  margin-bottom: 0.2rem;
  font-size: clamp(1.8rem, 6vw, 2.7rem);
  font-weight: 500;
  letter-spacing: -0.055em;
}

.dashboard-welcome p {
  font-size: 0.78rem;
}

.dashboard-section {
  margin-top: 1.2rem;
}

.dashboard-section-heading {

}

.dashboard-section-heading h2 {

}

.section-summary {

}

.current-plan-card {

.current-plan-copy {

.current-plan-title-row {

.current-plan-title-row h3 {

.current-plan-copy > p {

.plan-facts {

.plan-facts span,

.plan-facts span {

.plan-facts strong {

.billing-description {

.profile-name-form,

.profile-name-form input,

/* ==============================================================
   Dog Loading Screen Overlay
   ============================================================== */
#page-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--canvas);
  transition: opacity 0.45s ease, visibility 0.45s ease;
  gap: 1.2rem;
}

#page-loader.loader-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Dog loader extras — appended to site.css via node script */

#page-loader .loader-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.06em;
  animation: loader-pulse 1.4s ease-in-out infinite;
}

@keyframes loader-pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

#page-loader .main {
  position: relative;
  width: min(23.5vmax, 200px);
  height: min(23.5vmax, 200px);
  display: flex;
  justify-content: center;
  align-items: center;
}

#page-loader .leg {
  position: absolute;
  bottom: 0;
  width: 2vmax;
  height: 2.125vmax;
}

#page-loader .paw {
  position: absolute;
  bottom: 2px;
  left: 0;
  width: 1.95vmax;
  height: 1.8vmax;
  overflow: hidden;
}

#page-loader .paw::before {
  content: "";
  position: absolute;
  width: 5vmax;
  height: 3vmax;
  border-radius: 50%;
}

#page-loader .top {
  position: absolute;
  bottom: 0;
  left: 0.75vmax;
  height: 4.5vmax;
  width: 2.625vmax;
  border-top-left-radius: 1.425vmax;
  border-top-right-radius: 1.425vmax;
  transform-origin: bottom right;
  transform: rotateZ(90deg) translateX(-0.1vmax) translateY(1.5vmax);
  z-index: -1;
  background-image: linear-gradient(70deg, transparent 20%, #deac80 20%);
}

#page-loader .dog {
  position: relative;
  width: min(20vmax, 170px);
  height: min(8vmax, 68px);
}

#page-loader .dog::before {
  content: "";
  position: absolute;
  bottom: -0.75vmax;
  right: -0.15vmax;
  width: 100%;
  height: 1.5vmax;
  background-color: #b5c18e;
  border-radius: 50%;
  z-index: -1000;
  animation: dog-shadow 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__head {
  position: absolute;
  left: 4.5vmax;
  bottom: 0;
  width: 8vmax;
  height: 5vmax;
  border-top-left-radius: 4.05vmax;
  border-top-right-radius: 4.05vmax;
  border-bottom-right-radius: 3.3vmax;
  border-bottom-left-radius: 3.3vmax;
  background-color: #deac80;
  animation: dog-head 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__head-c {
  position: absolute;
  left: 1.5vmax;
  bottom: 0;
  width: 9.75vmax;
  height: 8.25vmax;
  animation: dog-head 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
  z-index: -1;
}

#page-loader .dog__snout {
  position: absolute;
  left: -1.5vmax;
  bottom: 0;
  width: 7.5vmax;
  height: 3.75vmax;
  border-top-right-radius: 3vmax;
  border-bottom-right-radius: 3vmax;
  border-bottom-left-radius: 4.5vmax;
  background-color: #f7dcb9;
  animation: dog-snout 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__snout::before {
  content: "";
  position: absolute;
  left: -0.1125vmax;
  top: -0.15vmax;
  width: 1.875vmax;
  height: 1.125vmax;
  border-top-right-radius: 3vmax;
  border-bottom-right-radius: 3vmax;
  border-bottom-left-radius: 4.5vmax;
  background-color: #6c4e31;
  animation: dog-snout-b 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__nose {
  position: absolute;
  top: -1.95vmax;
  left: 40%;
  width: 0.75vmax;
  height: 2.4vmax;
  border-radius: 0.525vmax;
  transform-origin: bottom;
  transform: rotateZ(10deg);
  background-color: #d7dbd2;
}

#page-loader .dog__eye-l,
#page-loader .dog__eye-r {
  position: absolute;
  top: -0.9vmax;
  width: 0.675vmax;
  height: 0.375vmax;
  border-radius: 50%;
  background-color: #1c3130;
  animation: dog-eye 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__eye-l { left: 27%; }
#page-loader .dog__eye-r { left: 65%; }

#page-loader .dog__ear-l,
#page-loader .dog__ear-r {
  position: absolute;
  width: 5vmax;
  height: 3.3vmax;
  border-top-left-radius: 3.3vmax;
  border-top-right-radius: 3vmax;
  border-bottom-right-radius: 5vmax;
  border-bottom-left-radius: 5vmax;
  background-color: #deac80;
}

#page-loader .dog__ear-l {
  top: 1.5vmax; left: 10vmax;
  transform-origin: bottom left;
  transform: rotateZ(-50deg);
  z-index: -1;
  animation: dog-ear-l 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__ear-r {
  top: 1.5vmax; right: 3vmax;
  transform-origin: bottom right;
  transform: rotateZ(25deg);
  z-index: -2;
  animation: dog-ear-r 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__body {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: absolute;
  bottom: 0.3vmax; left: 6vmax;
  width: 18vmax; height: 4vmax;
  border-top-left-radius: 3vmax;
  border-top-right-radius: 6vmax;
  border-bottom-right-radius: 1.5vmax;
  border-bottom-left-radius: 6vmax;
  background-color: #914f1e;
  z-index: -2;
  animation: dog-body 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

#page-loader .dog__tail {
  position: absolute;
  top: 20px; right: -1.5vmax;
  height: 3vmax; width: 4vmax;
  background-color: #914f1e;
  border-radius: 1.5vmax;
}

#page-loader .dog__paws {
  position: absolute;
  bottom: 0; left: 7.5vmax;
  width: 10vmax; height: 3vmax;
}

#page-loader .dog__bl-leg { left: -3vmax; z-index: -10; }
#page-loader .dog__bl-paw::before { background-color: #fffbe6; }
#page-loader .dog__bl-top { background-image: linear-gradient(80deg, transparent 20%, #deac80 20%); }
#page-loader .dog__fl-leg { z-index: 10; left: 0; }
#page-loader .dog__fl-paw::before { background-color: #fffbe6; }
#page-loader .dog__fr-leg { right: 0; }
#page-loader .dog__fr-paw::before { background-color: #fffbe6; }

@keyframes dog-head {
  0%, 10%, 20%, 26%, 28%, 90%, 100% { height: 8.25vmax; bottom: 0; transform: rotateZ(0); }
  5%, 15%, 22%, 24%, 30% { height: 8.1vmax; }
  32%, 50% { height: 8.25vmax; }
  55%, 60% { bottom: 0.75vmax; transform: rotateZ(0); }
  70%, 80% { bottom: 0.75vmax; transform: rotateZ(10deg); }
}

@keyframes dog-body {
  0%, 10%, 20%, 26%, 28%, 32%, 100% { height: 7.2vmax; }
  5%, 15%, 22%, 24%, 30% { height: 7.05vmax; }
}

@keyframes dog-ear-l {
  0%, 10%, 20%, 26%, 28%, 82%, 100% { transform: rotateZ(-50deg); }
  5%, 15%, 22%, 24% { transform: rotateZ(-48deg); }
  30%, 31% { transform: rotateZ(-30deg); }
  32%, 80% { transform: rotateZ(-60deg); }
}

@keyframes dog-ear-r {
  0%, 10%, 20%, 26%, 28% { transform: rotateZ(20deg); }
  5%, 15%, 22%, 24% { transform: rotateZ(18deg); }
  30%, 31% { transform: rotateZ(10deg); }
  32% { transform: rotateZ(25deg); }
}

@keyframes dog-snout {
  0%, 10%, 20%, 26%, 28%, 82%, 100% { height: 3.75vmax; }
  5%, 15%, 22%, 24% { height: 3.45vmax; }
}

@keyframes dog-snout-b {
  0%, 10%, 20%, 26%, 28%, 98%, 100% { width: 1.875vmax; }
  5%, 15%, 22%, 24% { width: 1.8vmax; }
  34%, 98% { width: 1.275vmax; }
}

@keyframes dog-shadow {
  0%, 10%, 20%, 26%, 28%, 30%, 84%, 100% { width: 99%; }
  5%, 15%, 22%, 24% { width: 101%; }
  34%, 81% { width: 96%; }
}

@keyframes dog-eye {
  0%, 30% { width: 0.675vmax; height: 0.3vmax; }
  32%, 59%, 90%, 100% { width: 0.525vmax; height: 0.525vmax; transform: translateY(0); }
  60%, 75% { transform: translateY(-0.3vmax); }
  80%, 85% { transform: translateY(0.15vmax); }
}

/* -------------------------------------------------------------
 * The Double Delete Button (Exact Adam Whitcroft Dribbble UI)
 * ----------------------------------------------------------- */
.double-delete-btn {
  display: inline-flex;
  cursor: pointer;
  border: 0;
  background: transparent;
  outline: 0;
  overflow: hidden;
  padding: 0;
  margin: 0;
  height: 30px;
  vertical-align: middle;
  transition: all 0.2s ease;
  user-select: none;
  border-radius: 2px;
}

.double-delete-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}

.double-delete-btn .icon {
  position: relative;
  background: #1D242B;
  line-height: 30px;
  width: 30px;
  height: 30px;
  text-align: center;
  color: #ffffff;
  font-size: 16px;
  transition: 0.2s color, 0.2s border-radius;
  border-radius: 2px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.double-delete-btn .icon .fa {
  width: 30px;
  height: 30px;
  line-height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: 0.2s all;
  color: #ffffff;
}

.double-delete-btn .icon .fa-check {
  color: #38B87C;
}

.double-delete-btn .icon .fa-question {
  color: #2492FF;
}

.double-delete-btn .icon:after {
  content: ' ';
  display: block;
  position: absolute;
  width: 5px;
  height: 5px;
  transform: rotate(45deg);
  background: #1D242B;
  top: 12.5px;
  right: 1px;
  transition: 0.2s right;
  z-index: 1;
}

.double-delete-btn .text {
  position: relative;
  width: 0;
  height: 30px;
  overflow: hidden;
  font-family: "Roboto", sans-serif;
  background: #F34541;
  text-align: center;
  line-height: 30px;
  color: #ffffff;
  font-weight: 300;
  font-size: 13px;
  transition: 0.2s all;
  border-top-right-radius: 2px;
  border-bottom-right-radius: 2px;
  white-space: nowrap;
}

.double-delete-btn .text span {
  width: 100%;
  opacity: 0;
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  transition: 0.3s all;
  font-size: 13px;
}

/* Hover State */
.double-delete-btn:not(:disabled):hover .icon {
  color: #F34541;
  border-radius: 0;
  border-top-left-radius: 2px;
  border-bottom-left-radius: 2px;
}

.double-delete-btn:not(:disabled):hover .icon .fa-trash-o {
  color: #F34541;
}

.double-delete-btn:not(:disabled):hover .icon:after {
  right: -2px;
}

.double-delete-btn:not(:disabled):hover .text {
  width: 120px;
}

.double-delete-btn:not(:disabled):hover .text span {
  opacity: 1;
  top: 0;
}

/* Confirm State (First Click) */
.double-delete-btn.confirm .icon {
  border-radius: 0;
  border-top-left-radius: 2px;
  border-bottom-left-radius: 2px;
}

.double-delete-btn.confirm .icon .fa {
  transform: translateY(-30px);
}

.double-delete-btn.confirm .icon:after {
  right: -2px;
}

.double-delete-btn.confirm .text {
  background: #2492FF;
  width: 120px;
}
